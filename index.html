<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOLE 형상 정밀 통합 검사 V9</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --bg:#F4F5F2; --card:#FFFFFF; --ink:#1C2320; --sub:#6B746F;
    --line:#E1E4DF; --accent:#0E5E63; --accent-soft:#E3EFEF;
    --pass:#1E7A46; --pass-bg:#E7F3EC; --fail:#C4372B; --fail-bg:#FBEAE7;
    --warn:#9A6B00; --warn-bg:#FBF3DC;
    --mono:'Consolas','IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard','Malgun Gothic','맑은 고딕',sans-serif;
    font-size:14px; padding:16px 20px; margin:0;
  }
  .layout{display:flex; gap:16px; align-items:flex-start;}
  .col-main{flex:1; order:2; min-width:0;}
  .col-side{flex:0 0 480px; order:1; position:sticky; top:12px;
    max-height:calc(100vh - 24px); overflow-y:auto;}
  @media (max-width:1150px){
    .layout{display:block;}
    .col-side{position:static; max-height:none; overflow:visible;}
  }
  header{display:flex; align-items:baseline; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  header h1{font-size:21px; font-weight:700; letter-spacing:-0.3px;}
  header .tag{font-size:12px; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:20px; font-weight:600;}
  header .desc{font-size:12px; color:var(--sub); width:100%; line-height:1.7;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px;}

  .controls{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11.5px; color:var(--sub); font-weight:600;}
  .field .pair{display:flex; gap:5px; align-items:center;}
  .field input[type=number]{
    width:78px; padding:7px 8px; border:1px solid var(--line); border-radius:7px;
    font-family:var(--mono); font-size:13px; background:#FAFBF9;
  }
  .btn{
    padding:9px 16px; border:none; border-radius:8px; cursor:pointer;
    font-size:13.5px; font-weight:600; font-family:inherit; transition:filter .12s;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:disabled{opacity:.45; cursor:default;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:#EEF1ED; color:var(--ink);}
  #folderInput{display:none;}
  #folderName{font-size:12px; color:var(--sub); font-family:var(--mono);}

  .thres-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 20px; margin-top:14px; padding-top:13px; border-top:1px dashed var(--line);}
  .thres{display:flex; flex-direction:column; gap:4px;}
  .thres label{font-size:11.5px; color:var(--sub); font-weight:600;}
  .thres .row{display:flex; align-items:center; gap:10px;}
  .thres input[type=range]{flex:1; accent-color:var(--accent);}
  .thres .val{font-family:var(--mono); font-size:14.5px; font-weight:700; color:var(--accent); width:48px;}

  #progressWrap{display:none;}
  .spin{display:inline-block; width:12px; height:12px; border:2px solid var(--accent);
    border-top-color:transparent; border-radius:50%; animation:sp .8s linear infinite;
    vertical-align:-2px; margin-right:7px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pbar{height:8px; background:#E8EBE6; border-radius:5px; overflow:hidden; margin-top:6px;}
  .pbar > div{height:100%; width:0%; background:var(--accent); transition:width .1s;}
  #progressText{font-size:12.5px; color:var(--sub); font-family:var(--mono);}

  .summary{display:none; grid-template-columns:repeat(2,1fr); gap:10px;}
  .sum-item{border:1px solid var(--line); border-radius:9px; padding:12px 14px; background:#FAFBF9;}
  .sum-item .n{font-size:25px; font-weight:800; font-family:var(--mono); line-height:1.2;}
  .sum-item .t{font-size:11.5px; color:var(--sub); font-weight:600; margin-top:2px;}
  .sum-item .sub2{font-size:11px; color:var(--sub); font-family:var(--mono); margin-top:4px;}
  .sum-item.pass .n{color:var(--pass);}
  .sum-item.fail .n{color:var(--fail);}
  .sum-item.warn .n{color:var(--warn);}

  #distCard{display:none;}
  #distCard h3, #listCard h3{font-size:13.5px; font-weight:700; margin-bottom:10px;}
  #distCanvas{width:100%; height:74px; display:block;}
  .dist-note{font-size:11.5px; color:var(--sub); margin-top:6px; line-height:1.6;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:-1px; margin-right:2px;}

  #listCard{display:none;}
  .list-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .list-head label{font-size:12.5px; color:var(--sub); display:flex; align-items:center; gap:5px; cursor:pointer;}
  table{width:100%; border-collapse:collapse;}
  th{font-size:11.5px; color:var(--sub); text-align:left; padding:7px 8px; border-bottom:2px solid var(--line); font-weight:700;}
  td{padding:6px 8px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle;}
  tr.row-item{cursor:pointer;}
  tr.row-item:hover{background:#F6F8F5;}
  td.mono{font-family:var(--mono); font-size:12.5px;}
  td img{width:64px; height:48px; object-fit:cover; border-radius:5px; border:1px solid var(--line); display:block;}
  .badge{display:inline-block; padding:2.5px 9px; border-radius:12px; font-size:11.5px; font-weight:700; white-space:nowrap;}
  .badge.pass{background:var(--pass-bg); color:var(--pass);}
  .badge.fail{background:var(--fail-bg); color:var(--fail);}
  .badge.warn{background:var(--warn-bg); color:var(--warn);}
  .empty{color:var(--sub); font-size:13px; padding:14px 4px;}

  #modal{display:none; position:fixed; inset:0; background:rgba(15,20,18,.72); z-index:50;
    align-items:center; justify-content:center; padding:20px;}
  #modal .box{background:#fff; border-radius:10px; max-width:720px; width:100%; overflow:hidden;}
  #modal img{width:100%; display:block;}
  #modal .cap{padding:11px 15px; display:flex; justify-content:space-between; align-items:center; font-size:13px; gap:10px; flex-wrap:wrap;}
  #modal .cap .fn{font-family:var(--mono); font-weight:700;}
  #modal .cap button{border:none; background:#EEF1ED; padding:6px 13px; border-radius:7px; cursor:pointer; font-family:inherit;}
</style>
</head>
<body>

<header>
  <h1>HOLE 형상 정밀 통합 검사</h1>
  <span class="tag">V9 · 고정밀 에지 매칭 엔진</span>
  <div class="desc">
    밝기 반전 및 배경 얼룩 노이즈를 완벽 차단하고, <b>실제 홀의 가장 강력한 원형 경계선</b>만 추적합니다.
  </div>
</header>

<div class="layout">
<div class="col-side">

<div class="card">
  <div class="controls">
    <div class="field">
      <label>검사 폴더</label>
      <button class="btn btn-primary" id="btnFolder">폴더 선택 후 검사 시작</button>
      <input type="file" id="folderInput" webkitdirectory multiple>
    </div>
    <div class="field">
      <label>검사 번호 범위 (기본: 15 ~ 622)</label>
      <div class="pair">
        <input type="number" id="fromNum" value="15"> ~ <input type="number" id="toNum" value="622">
      </div>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button class="btn btn-ghost" id="btnExcel" disabled>엑셀 다운로드</button>
    </div>
  </div>

  <div class="thres-grid">
    <div class="thres">
      <label>진원도 (미만 → 찌그러짐)</label>
      <div class="row">
        <input type="range" id="roundMin" min="0.50" max="0.98" step="0.01" value="0.80">
        <span class="val" id="roundMinVal">0.80</span>
      </div>
    </div>
    <div class="thres">
      <label>에지 거칠음 px (이상 → 윤곽불량)</label>
      <div class="row">
        <input type="range" id="roughMax" min="0.5" max="10.0" step="0.5" value="3.5">
        <span class="val" id="roughMaxVal">3.5</span>
      </div>
    </div>
    <div class="thres">
      <label>이빠짐 깊이 px (이상 → 함몰)</label>
      <div class="row">
        <input type="range" id="chipMax" min="1.0" max="15.0" step="0.5" value="4.5">
        <span class="val" id="chipMaxVal">4.5</span>
      </div>
    </div>
    <div class="thres">
      <label>Burr 높이 px (이상 → 버발생)</label>
      <div class="row">
        <input type="range" id="burrMax" min="1.0" max="15.0" step="0.5" value="5.0">
        <span class="val" id="burrMaxVal">5.0</span>
      </div>
    </div>
  </div>

  <div id="folderName" style="margin-top:10px;"></div>
  <div id="progressWrap" style="margin-top:10px;">
    <span id="spinner" class="spin" style="display:none;"></span><span id="progressText"></span>
    <div class="pbar"><div id="pfill"></div></div>
  </div>
</div>

<div class="card summary" id="summary">
  <div class="sum-item">
    <div class="n" id="cntTotal">0</div><div class="t">검사 수량</div>
  </div>
  <div class="sum-item pass"><div class="n" id="cntPass">0</div><div class="t">합격</div></div>
  <div class="sum-item fail">
    <div class="n" id="cntFail">0</div><div class="t">부적합</div>
    <div class="sub2" id="cntByReason"></div>
  </div>
  <div class="sum-item warn"><div class="n" id="cntWarn">0</div><div class="t">판정불가</div></div>
</div>

<div class="card" id="distCard">
  <h3>진원도(Circularity) 분포</h3>
  <canvas id="distCanvas"></canvas>
  <div class="dist-note">
    <span class="dot" style="background:#1E7A46"></span>합격 &nbsp;
    <span class="dot" style="background:#C4372B"></span>부적합 &nbsp;·&nbsp; 세로선 = 진원도 기준.
  </div>
</div>

</div><!-- /col-side -->
<div class="col-main">

<div class="card" id="listCard">
  <div class="list-head">
    <h3 id="listTitle">부적합 LIST</h3>
    <label><input type="checkbox" id="chkAll"> 전체 결과 보기</label>
  </div>
  <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>썸네일</th><th>파일명</th><th>번호</th><th>측정값 (진원도 / 거칠음 / 함몰 / Burr)</th><th>판정</th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
  <div class="empty" id="emptyMsg" style="display:none;"></div>
</div>

</div><!-- /col-main -->
</div><!-- /layout -->

<div id="modal">
  <div class="box">
    <img id="modalImg" alt="">
    <div class="cap">
      <span class="fn" id="modalCap"></span>
      <span style="display:flex; gap:6px; align-items:center;">
        <span id="modalPos" style="font-family:var(--mono); color:var(--sub); font-size:12.5px;"></span>
        <button id="btnPrev" onclick="moveModal(-1)">◀ 이전</button>
        <button id="btnNext" onclick="moveModal(1)">다음 ▶</button>
        <button onclick="closeModal()">닫기</button>
      </span>
    </div>
  </div>
</div>

<script>
'use strict';

let results = [];
let analyzing = false;
let folderTitle = '';
const $ = id => document.getElementById(id);

function extractNum(name){
  const m = name.match(/_(\d+)\.jpe?g$/i) || name.match(/(\d+)\.jpe?g$/i);
  return m ? parseInt(m[1], 10) : null;
}

function toGray(data, W, H){
  const gray = new Float32Array(W*H);
  for(let i=0; i<W*H; i++){
    gray[i] = 0.299*data[i*4] + 0.587*data[i*4+1] + 0.114*data[i*4+2];
  }
  return gray;
}

/* ==============================================================
   명암 반전 및 얼룩 보정 완료 알고리즘 (V9)
============================================================== */
function analyzeHoleShape(data, W, H){
  const gray = toGray(data, W, H);

  // 1. 이미지의 중앙(Center Zone)을 기준으로 홀의 위치 고정
  const cx = W / 2;
  const cy = H / 2;

  // 2. 검색 반경 범위 설정 (중심부 홀 크기에 맞춰 스캔)
  const minR = Math.min(W, H) * 0.05;  // 최소 반경
  const maxR = Math.min(W, H) * 0.22;  // 최대 반경 (배경 노이즈로 나가는 것 제한)

  const NUM_ANGLES = 72;
  const edgePts = [];
  const radii = [];

  // 3. 각 각도별 절대 명암 변화율(Gradient Magnitude) 탐색
  for(let i=0; i<NUM_ANGLES; i++){
    const rad = (i * 360 / NUM_ANGLES) * Math.PI / 180;
    const dx = Math.cos(rad);
    const dy = Math.sin(rad);

    let maxGrad = -1;
    let bestR = (minR + maxR) / 2;

    for(let r=minR; r<=maxR; r+=0.5){
      const px = Math.round(cx + dx * r);
      const py = Math.round(cy + dy * r);
      if(px < 2 || px >= W-2 || py < 2 || py >= H-2) break;

      const idxIn = Math.round(cy + dy*(r-2.0))*W + Math.round(cx + dx*(r-2.0));
      const idxOut = Math.round(cy + dy*(r+2.0))*W + Math.round(cx + dx*(r+2.0));
      
      // 명암의 절대 변화량 (밝음->어두움, 어두움->밝음 모두 포착)
      const grad = Math.abs(gray[idxIn] - gray[idxOut]);

      if(grad > maxGrad){
        maxGrad = grad;
        bestR = r;
      }
    }

    radii.push(bestR);
    edgePts.push({ x: cx + dx * bestR, y: cy + dy * bestR });
  }

  // 4. 측정 지표 계산 (진원도, 거칠음, 함몰, Burr)
  let rSum = 0;
  for(const r of radii) rSum += r;
  const rMean = rSum / NUM_ANGLES;

  let varSum = 0;
  let maxChip = 0;
  let maxBurr = 0;

  for(const r of radii){
    const diff = r - rMean;
    varSum += diff * diff;
    if(diff < 0 && Math.abs(diff) > maxChip) maxChip = Math.abs(diff);
    if(diff > 0 && diff > maxBurr) maxBurr = diff;
  }

  const roughness = Math.sqrt(varSum / NUM_ANGLES);
  // 진원도 (1.0에 가까울수록 원형)
  const roundness = Math.max(0, Math.min(1.0, 1.0 - (roughness / (rMean * 0.35))));

  return {
    found: true, cx, cy, rMean,
    roundness, roughness, chipDepth: maxChip, burrHeight: maxBurr, edgePts
  };
}

async function analyzeFile(file){
  const bmp = await createImageBitmap(file);
  const W = 320, H = Math.max(1, Math.round(bmp.height * W / bmp.width));
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(bmp, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H).data;
  
  const r = analyzeHoleShape(data, W, H);

  const TW = 160, TH = Math.round(H * TW / W);
  const tc = document.createElement('canvas');
  tc.width = TW; tc.height = TH;
  const tctx = tc.getContext('2d');
  tctx.drawImage(bmp, 0, 0, TW, TH);
  const sc = TW / W;

  if(r.found && r.edgePts.length > 0){
    tctx.strokeStyle = '#E53935';
    tctx.lineWidth = 1.5;
    tctx.beginPath();
    tctx.moveTo(r.edgePts[0].x * sc, r.edgePts[0].y * sc);
    for(let i=1; i<r.edgePts.length; i++){
      tctx.lineTo(r.edgePts[i].x * sc, r.edgePts[i].y * sc);
    }
    tctx.closePath();
    tctx.stroke();
  }

  const thumb = tc.toDataURL('image/jpeg', 0.75);
  bmp.close();
  return { ...r, thumb };
}

$('btnFolder').addEventListener('click', () => {
  if(!analyzing) $('folderInput').click();
});

$('folderInput').addEventListener('change', async e => {
  const all = Array.from(e.target.files);
  e.target.value = '';
  if(!all.length) return;

  analyzing = true;
  $('btnFolder').disabled = true;
  const btnOrig = $('btnFolder').textContent;
  $('btnFolder').textContent = '검사 중...';
  $('progressWrap').style.display = 'block';
  $('spinner').style.display = 'inline-block';
  $('pfill').style.width = '0%';
  $('progressText').textContent = '파일 읽는 중... (' + all.length + '개 확인)';
  await new Promise(r => setTimeout(r, 30));

  const fNum = parseInt($('fromNum').value, 10);
  const tNum = parseInt($('toNum').value, 10);

  const targets = [];
  for(const f of all){
    const rel = f.webkitRelativePath || f.name;
    if(rel.split('/').length > 2) continue;
    const num = extractNum(f.name);
    if(num === null) continue;
    if(!isNaN(fNum) && !isNaN(tNum) && num >= fNum && num <= tNum){
      targets.push({file:f, num});
    }
  }
  targets.sort((a,b) => a.num - b.num);

  const folder = all[0].webkitRelativePath ? all[0].webkitRelativePath.split('/')[0] : '';
  folderTitle = folder;
  $('folderName').textContent =
    (folder ? '폴더: ' + folder + ' · ' : '') +
    '범위(' + fNum + '~' + tNum + ') 대상: ' + targets.length + '개';

  if(!targets.length){
    analyzing = false;
    $('btnFolder').disabled = false;
    $('btnFolder').textContent = btnOrig;
    $('spinner').style.display = 'none';
    alert('범위에 해당하는 파일이 없습니다.');
    return;
  }

  $('btnExcel').disabled = true;
  results = [];

  for(let i=0; i<targets.length; i++){
    const t = targets[i];
    try{
      const r = await analyzeFile(t.file);
      results.push({ name:t.file.name, num:t.num, file:t.file, ...r, verdict:'', reason:'' });
    }catch(err){
      results.push({ name:t.file.name, num:t.num, file:t.file,
        found:false, roundness:0, roughness:0, chipDepth:0, burrHeight:0, thumb:'', verdict:'', reason:'' });
    }
    $('pfill').style.width = ((i+1)/targets.length*100).toFixed(1) + '%';
    if(i % 3 === 0) await new Promise(r => setTimeout(r, 0));
  }

  analyzing = false;
  $('btnFolder').disabled = false;
  $('btnFolder').textContent = btnOrig;
  $('spinner').style.display = 'none';
  $('btnExcel').disabled = false;
  judge();
});

function judge(){
  if(!results.length) return;
  const roundMin = parseFloat($('roundMin').value);
  const roughMax = parseFloat($('roughMax').value);
  const chipMax = parseFloat($('chipMax').value);
  const burrMax = parseFloat($('burrMax').value);

  const rc = {'찌그러짐':0, '윤곽불량':0, '이빠짐/크랙':0, '버발생':0};
  let pass=0, fail=0, warn=0;

  for(const r of results){
    if(!r.found){ r.verdict='판정불가'; r.reason='탐지 실패'; warn++; continue; }
    
    if(r.roundness < roundMin){ r.verdict='부적합'; r.reason='찌그러짐'; }
    else if(r.roughness > roughMax){ r.verdict='부적합'; r.reason='윤곽불량'; }
    else if(r.chipDepth > chipMax){ r.verdict='부적합'; r.reason='이빠짐/크랙'; }
    else if(r.burrHeight > burrMax){ r.verdict='부적합'; r.reason='버발생'; }
    else { r.verdict='합격'; r.reason=''; }

    if(r.verdict === '합격') pass++;
    else { fail++; if(rc[r.reason] !== undefined) rc[r.reason]++; }
  }

  $('cntTotal').textContent = results.length;
  $('cntPass').textContent = pass;
  $('cntFail').textContent = fail;
  $('cntByReason').textContent = '찌그러짐 ' + rc['찌그러짐'] + ' · 윤곽 ' + rc['윤곽불량'] + ' · 함몰 ' + rc['이빠짐/크랙'] + ' · 버 ' + rc['버발생'];
  $('cntWarn').textContent = warn;
  $('summary').style.display = 'grid';
  $('listCard').style.display = 'block';

  $('distCard').style.display = 'block';
  drawDist(roundMin);
  renderList();
}

$('roundMin').addEventListener('input', () => { $('roundMinVal').textContent = parseFloat($('roundMin').value).toFixed(2); judge(); });
$('roughMax').addEventListener('input', () => { $('roughMaxVal').textContent = parseFloat($('roughMax').value).toFixed(1); judge(); });
$('chipMax').addEventListener('input', () => { $('chipMaxVal').textContent = parseFloat($('chipMax').value).toFixed(1); judge(); });
$('burrMax').addEventListener('input', () => { $('burrMaxVal').textContent = parseFloat($('burrMax').value).toFixed(1); judge(); });
$('chkAll').addEventListener('change', renderList);

function drawDist(th){
  const cv = $('distCanvas');
  const w = cv.clientWidth, h = 74;
  cv.width = w * devicePixelRatio; cv.height = h * devicePixelRatio;
  const ctx = cv.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0,0,w,h);

  const LO = 0.50, HI = 1.00;
  const X = v => (Math.min(HI, Math.max(LO, v)) - LO) / (HI - LO) * (w - 20) + 10;

  ctx.strokeStyle = '#D6DAD4';
  ctx.beginPath(); ctx.moveTo(10, h-18); ctx.lineTo(w-10, h-18); ctx.stroke();
  ctx.fillStyle = '#8A938D'; ctx.font = '10px Consolas,monospace';
  for(let v=0.50; v<=1.001; v+=0.10){
    ctx.fillText(v.toFixed(2), X(v)-10, h-5);
  }

  let j = 0;
  for(const r of results){
    if(r.verdict === '판정불가') continue;
    const x = X(r.roundness);
    const y = 14 + ((j * 7) % 30); j++;
    ctx.fillStyle = r.verdict === '합격' ? '#1E7A46' : '#C4372B';
    ctx.globalAlpha = 0.75;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = '#0E5E63'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(X(th), 6); ctx.lineTo(X(th), h-18); ctx.stroke();
}

function metricText(r){
  if(!r.found) return '-';
  return '원 ' + r.roundness.toFixed(3) + ' · 거칠음 ' + r.roughness.toFixed(1) + ' · 함몰 ' + r.chipDepth.toFixed(1) + ' · Burr ' + r.burrHeight.toFixed(1);
}

function renderList(){
  const showAll = $('chkAll').checked;
  const rows = showAll ? results : results.filter(r => r.verdict !== '합격');
  $('listTitle').textContent = showAll ? '전체 결과 (' + rows.length + ')' : '부적합 LIST (' + rows.length + ')';

  const tb = $('listBody');
  tb.innerHTML = '';
  $('emptyMsg').style.display = rows.length ? 'none' : 'block';
  $('emptyMsg').textContent = showAll ? '결과가 없습니다.' : '부적합이 없습니다. 전량 합격입니다.';

  const frag = document.createDocumentFragment();
  for(const r of rows){
    const tr = document.createElement('tr');
    tr.className = 'row-item';
    const cls = r.verdict === '합격' ? 'pass' : r.verdict === '판정불가' ? 'warn' : 'fail';
    const vtext = r.verdict === '부적합' ? '부적합·' + r.reason : r.verdict;
    tr.innerHTML =
      '<td>' + (r.thumb ? '<img src="' + r.thumb + '" alt="">' : '-') + '</td>' +
      '<td class="mono">' + r.name + '</td>' +
      '<td class="mono">' + r.num + '</td>' +
      '<td class="mono">' + metricText(r) + '</td>' +
      '<td><span class="badge ' + cls + '">' + vtext + '</span></td>';
    const idx = rows.indexOf(r);
    tr.addEventListener('click', () => openModalAt(rows, idx));
    frag.appendChild(tr);
  }
  tb.appendChild(frag);
}

let modalUrl = null, modalRows = [], modalIdx = -1;
function showModalItem(){
  const r = modalRows[modalIdx];
  if(modalUrl) URL.revokeObjectURL(modalUrl);
  modalUrl = URL.createObjectURL(r.file);
  $('modalImg').src = modalUrl;
  $('modalCap').textContent = r.name + ' · ' + metricText(r) + ' · ' + r.verdict + (r.reason ? '(' + r.reason + ')' : '');
  $('modalPos').textContent = (modalIdx+1) + ' / ' + modalRows.length;
  $('btnPrev').disabled = modalIdx <= 0;
  $('btnNext').disabled = modalIdx >= modalRows.length-1;
}
function openModalAt(rows, idx){
  modalRows = rows; modalIdx = idx;
  $('modal').style.display = 'flex';
  showModalItem();
}
function moveModal(d){
  const ni = modalIdx + d;
  if(ni < 0 || ni >= modalRows.length) return;
  modalIdx = ni;
  showModalItem();
}
function closeModal(){
  $('modal').style.display = 'none';
  $('modalImg').src = '';
  if(modalUrl){ URL.revokeObjectURL(modalUrl); modalUrl = null; }
  modalRows = []; modalIdx = -1;
}
$('modal').addEventListener('click', e => { if(e.target === $('modal')) closeModal(); });
</script>
</body>
</html>
